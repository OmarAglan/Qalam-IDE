name: Build Qalam IDE

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows standalone installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OmarAglan/Baa-LSP
          ref: 96313fb28585f0aebcda856e39a092a7e704a252
          path: ecosystem/Baa-LSP
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Bootstrap, build, test, and package standalone Qalam
        shell: pwsh
        run: .\scripts\bootstrap-windows.ps1 -SkipWinget -BuildTests -SkipCompiler -BaaLspSourceDir ecosystem/Baa-LSP
      - name: Build standalone installer
        shell: pwsh
        run: .\scripts\build_installer.ps1 -Version 3.7.0 -BuildDir build/windows-release -BaaLspExecutable ecosystem/Baa-LSP/build/windows-release/baa-lsp.exe -SkipBuild
      - name: Verify install, launch, and uninstall
        shell: powershell
        run: .\scripts\test_installer.ps1 -Version 3.7.0
      - uses: actions/upload-artifact@v4
        with:
          name: qalam-setup-3.7.0-x64
          path: |
            dist/Qalam-win64.zip
            dist/Qalam-win64.zip.sha256
            dist/installer/qalam-setup-3.7.0-x64.exe
            dist/installer/qalam-setup-3.7.0-x64.exe.sha256

  linux:
    name: Linux build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OmarAglan/Baa-LSP
          ref: 96313fb28585f0aebcda856e39a092a7e704a252
          path: ecosystem/Baa-LSP
      - uses: actions/checkout@v4
        with:
          repository: OmarAglan/Baa
          ref: 276a594491a4b08fed1b2ceca5fd3fc65bb5dad1
          path: ecosystem/Baa
      - uses: actions/checkout@v4
        with:
          repository: OmarAglan/Nazm
          ref: 42380994625f142fbcfdff92421da2d3f1e8df2f
          path: ecosystem/Nazm
      # The xcb and xkbcommon-x11 runtime libraries are what Qt's xcb platform
      # plugin links; the AppImage bundles them from here.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0 \
            libxcb-cursor-dev libxcb-xinerama0 libxcb-xinerama0-dev \
            libxkbcommon-x11-0 libx11-xcb1 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-render0 \
            libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 \
            libxcb-xinput0 libxcb-util1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Same Qt as Windows and scripts/bootstrap-linux.sh; the distro Qt 6.4
      # lacks APIs Qalam uses (QAccessibilityHints, setMaximumSequenceLength).
      - name: Install Qt 6.10.2
        run: |
          python -m pip install aqtinstall
          python -m aqt install-qt -O "$RUNNER_TEMP/Qt" linux desktop 6.10.2 linux_gcc_64
          echo "QALAM_QT_DIR=$RUNNER_TEMP/Qt/6.10.2/gcc_64" >> "$GITHUB_ENV"
      - name: Build
        run: |
          cmake -S . -B build/linux-release -DCMAKE_BUILD_TYPE=Release -DQALAM_BUILD_TESTS=ON \
            -DCMAKE_PREFIX_PATH="$QALAM_QT_DIR"
          cmake --build build/linux-release --parallel "$(nproc)"
          QT_QPA_PLATFORM=offscreen ctest --test-dir build/linux-release --output-on-failure
          cmake -S ecosystem/Baa-LSP -B ecosystem/Baa-LSP/build \
            -DCMAKE_BUILD_TYPE=Release -DBAA_LSP_BUILD_TESTS=OFF
          cmake --build ecosystem/Baa-LSP/build --parallel "$(nproc)"
          cmake -S ecosystem/Baa -B ecosystem/Baa/build \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build ecosystem/Baa/build --parallel "$(nproc)" --target baa baa_runtime
          cmake -S ecosystem/Nazm -B ecosystem/Nazm/build \
            -DCMAKE_BUILD_TYPE=Release -DNAZM_BUILD_TESTS=OFF
          cmake --build ecosystem/Nazm/build --parallel "$(nproc)" --target nazm
      - name: Package Qalam developer archive with Baa-LSP, Baa, and Nazm
        run: |
          cmake --install build/linux-release --prefix dist/Qalam-linux-x86_64
          mkdir -p dist/Qalam-linux-x86_64/baa-lsp
          cp ecosystem/Baa-LSP/build/baa-lsp dist/Qalam-linux-x86_64/baa-lsp/baa-lsp
          mkdir -p dist/Qalam-linux-x86_64/baa/stdlib
          cp ecosystem/Baa/build/baa dist/Qalam-linux-x86_64/baa/baa
          cp ecosystem/Baa/build/libbaa_runtime.a dist/Qalam-linux-x86_64/baa/libbaa_runtime.a
          cp -R ecosystem/Baa/stdlib/. dist/Qalam-linux-x86_64/baa/stdlib/
          cp ecosystem/Nazm/build/نظم dist/Qalam-linux-x86_64/baa/نظم
          chmod +x dist/Qalam-linux-x86_64/baa/baa dist/Qalam-linux-x86_64/baa/نظم
          dist/Qalam-linux-x86_64/baa-lsp/baa-lsp --version
          dist/Qalam-linux-x86_64/baa/baa --version
          dist/Qalam-linux-x86_64/baa/نظم --إصدار
          mkdir -p dist/اختبار-حزمة
          printf 'صحيح الرئيسية() {\n    إرجع ٠.\n}\n' > dist/اختبار-حزمة/رئيسي.baa
          BAA_HOME="$PWD/dist/Qalam-linux-x86_64/baa" \
          BAA_NAZM="$PWD/dist/Qalam-linux-x86_64/baa/نظم" \
            dist/Qalam-linux-x86_64/baa/baa -c \
              dist/اختبار-حزمة/رئيسي.baa -o dist/اختبار-حزمة/رئيسي.o
          test -s dist/اختبار-حزمة/رئيسي.o
          rm -rf dist/اختبار-حزمة
          tar -C dist -czf dist/Qalam-linux-x86_64.tar.gz Qalam-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: Qalam-linux-x86_64
          path: dist/Qalam-linux-x86_64.tar.gz
      - name: Package standalone Qalam AppImage with internal Baa-LSP
        run: |
          ./scripts/package-linux.sh \
            --build-dir build/linux-release \
            --baa-lsp ecosystem/Baa-LSP/build/baa-lsp \
            --qt-dir "$QALAM_QT_DIR" \
            --output-dir dist/appimage
      # A fresh container has no Qt and only a desktop's baseline libraries, so
      # a pass means the AppImage carries everything else it needs.
      - name: Verify the AppImage on a clean Ubuntu 24.04 without Qt
        run: |
          docker run --rm -v "$PWD:/work" -w /work ubuntu:24.04 \
            bash scripts/test-linux-appimage.sh --install-desktop-baseline \
              dist/appimage/Qalam-*-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: Qalam-AppImage-x86_64
          path: dist/appimage/
